[project]
name = "github-webhook-monitor"
version = "0.2.0"
description = "A lightweight FastAPI service for receiving, validating, and inspecting GitHub webhook deliveries."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.141,<1.0",
    "httpx2>=2.12,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.12,<3.0",
    "pyjwt[crypto]>=2.13,<3",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.52,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that require external services such as PostgreSQL",
]
